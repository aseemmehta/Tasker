services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5273:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable file watching on Docker for Mac
    volumes:
      - .:/app
      - /app/node_modules          # keep the container's own node_modules

  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
