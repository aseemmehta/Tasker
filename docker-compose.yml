services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-5273}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable file watching on Docker for Mac
    volumes:
      - .:/app
      - /app/node_modules          # keep the container's own node_modules

  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    ports:
      - "${PROD_PORT:-8180}:80"
